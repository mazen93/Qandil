name: qandil
description: Qandil (قنديل) — Quran and daily-worship app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  adhan: ^2.0.0+1
  audio_session: ^0.2.4
  do_not_disturb: ^1.0.3
  drift: ^2.30.0
  drift_flutter: ^0.3.0
  fl_chart: ^1.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.4
  geolocator: ^14.0.2
  get_it: ^8.0.3
  go_router: ^15.1.2
  hijri_core: ^1.1.0
  home_widget: ^0.10.0
  http: ^1.6.0
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^12.0.0
  timezone: ^0.11.2
  wakelock_plus: ^1.4.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.15
  crypto: ^3.0.6
  drift_dev: ^2.30.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/logo/
    - assets/brand/tokens/
    - assets/data/quran_prelive_seed.json
    - assets/data/adhkar.json
  fonts:
    - family: UthmanicHafs
      fonts:
        - asset: assets/fonts/UthmanicHafs1Ver18.ttf
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/ReemKufi-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/qandil_app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0F2A2E"
  adaptive_icon_foreground: assets/brand/qandil_android_adaptive_foreground_1024.png
  adaptive_icon_monochrome: assets/brand/qandil_android_monochrome_1024.png

flutter_native_splash:
  color: "#0F2A2E"
  image: assets/brand/qandil_splash_mark_1024.png
  color_dark: "#0F2A2E"
  image_dark: assets/brand/qandil_splash_mark_1024.png
  android_12:
    color: "#0F2A2E"
    image: assets/brand/qandil_splash_mark_1024.png
